<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
	<title th:text="#{tasks.potentialTasks}"></title>
	<link rel="stylesheet"th:href="@{/css/tasks-styles.css}">
	<!-- Autor: Marco Antonio Maldonado Orozco -->
    <!-- Autor: Juan Manuel Ostos Rabadán -->
</head>
<body>
    <script th:src="@{/js/taskActions.js}"></script>
    <script th:src="@{/js/filterAction.js}"></script>
    <script th:src="@{/js/orderAction.js}"></script>
    <div class="header">
        <button class="back-button" onclick="window.location.href='/tasks'" th:text="#{back}"></button>
    	<h1 th:text="#{tasks.potentialTasks}"></h1>
    </div>
    <div class="filter-container">
        <label for="filterColumn" th:text="#{tasks.filterBy}"></label>
        <select id="filterColumn" onchange="toggleFilterInputs()">
            <option value="" th:text="#{tasks.none}" selected></option>
            <option value="name" th:text="#{tasks.name}"></option>
            <option value="createdOn" th:text="#{tasks.creationDate}"></option>
            <option value="expirationTime" th:text="#{tasks.expirationTime}"></option>
            <option value="priority" th:text="#{tasks.priority}"></option>
            <option value="subject" th:text="#{tasks.subject}"></option>
        </select>
        <input type="text" id="textFilterInput" onkeyup="filterTable()" placeholder="Type to filter..." style="display:none">
        <select id="prioritySelect" onchange="filterTable()" style="display:none">
            <option value="" th:text="#{task.priority.All}"></option>
            <option th:value="#{task.priority.High}" th:text="#{task.priority.High}"></option>
            <option th:value="#{task.priority.Medium}" th:text="#{task.priority.Medium}"></option>
            <option th:value="#{task.priority.Low}" th:text="#{task.priority.Low}"></option>
        </select>
        <select id="statusSelect" onchange="filterTable()" style="display:none">
            <option th:value="#{task.status.All}" th:text="#{task.status.All}"></option>
            <option th:value="#{task.status.Reserved}" th:text="#{task.status.Reserved}"></option>
            <option th:value="#{task.status.InProgress}" th:text="#{task.status.InProgress}"></option>
        </select>

        <div id="dateRangeInputs" style="display:none">
            <label for="startDate" id="from" th:text="#{tasks.from}"></label>
            <input type="datetime-local" id="startDate" onchange="filterTable()">
            <label for="endDate" id="to" th:text="#{tasks.to}"></label>
            <input type="datetime-local" id="endDate" onchange="filterTable()">
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th class="sortable" data-column="processId" onclick="sortByColumn('processId')">
                    <span th:text="#{tasks.processId}"></span>
                    <span class="sort-indicator"></span>
                </th>
                <th class="sortable" data-column="name" onclick="sortByColumn('name')">
                    <span th:text="#{tasks.name}"></span>
                    <span class="sort-indicator"></span>
                </th>
                <th class="sortable" data-column="createdOn" onclick="sortByColumn('createdOn')">
                    <span th:text="#{tasks.creationDate}"></span>
                    <span class="sort-indicator"></span>
                </th>
                <th class="sortable" data-column="expirationTime" onclick="sortByColumn('expirationTime')">
                    <span th:text="#{tasks.expirationTime}"></span>
                    <span class="sort-indicator"></span>
                </th>
                <th class="sortable" data-column="priority" onclick="sortByColumn('priority')">
                    <span th:text="#{tasks.priority}"></span>
                    <span class="sort-indicator"></span>
                </th>
                <th class="sortable" data-column="subject" onclick="sortByColumn('subject')">
                    <span th:text="#{tasks.subject}"></span>
                    <span class="sort-indicator"></span>
                </th>
                <th th:text="#{tasks.actions}"></th>
            </tr>
        </thead>
        <tbody>
            <th:block th:each="tasks : ${taskMap}">
                <tr th:each="task : ${tasks.value}">
                    <td data-column="processId" th:text="${task.processId}"></td>
                    <td data-column="name" th:text="${task.name}"></td>
                    <td data-column="createdOn" th:text="${#dates.format(task.createdOn, 'yyyy/MM/dd HH:mm:ss')}"></td>
                    <td data-column="expirationTime" th:text="${#dates.format(task.expirationTime, 'yyyy/MM/dd HH:mm:ss')}"></td>
                    <td data-column="priority" th:if="${task.priority <= 3}" th:text="#{task.priority.High}" style="color: red;"></td>
                    <td data-column="priority" th:if="${task.priority >= 4 and task.priority <= 6}" th:text="#{task.priority.Medium}" style="color: orange;"></td>
                    <td data-column="priority" th:if="${task.priority >= 7}" th:text="#{task.priority.Low}" style="color: green;"></td>
                    <td data-column="subject" th:text="${task.subject}"></td>                
                    <td class="actions">
                        <form method="post" action="/tasks/claim">
                            <input type="hidden" name="taskId" th:value="${task.id}">
                            <input type="hidden" name="containerId" th:value="${task.containerId}">
                            <input type="hidden" name="processInstanceId" th:value="${task.processInstanceId}">
                            <input type="hidden" name="serverIndex" th:value="${tasks.key}">
                            <button type="submit" th:text="#{tasks.claim}"></button>
                        </form>
                    </td>
                </tr>
            </th:block>
        </tbody>
    </table>
</body>
</html>
