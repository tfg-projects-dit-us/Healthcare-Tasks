<!DOCTYPE html>
<!-- Ayuda con edicion html https://www.w3schools.com/howto/default.asp -->
<html>

<head>
	<meta charset="UTF-8">
	<title th:text="#{navbar.questionnaireResponse}"></title>
	<link rel="stylesheet" href="/css/form-styles.css">
     <!-- Autor: Juan Manuel Ostos Rabadán -->
</head>
<body>
	<div th:insert="~{navbar.html}"/>
	<div class="title-container">
		<h3 th:id="questionnaireResponseId" class="title" th:text="${questionnaireResponseURI}" />
	</div>

    <div class="question-container" th:each="item : ${FormattedItems}">
        <div class="question-title" th:text="${item.key}"></div>
        <div class="answer" th:each="answer : ${item.value}" th:text="${answer}"></div>
    </div>
</body>
</html>
