#server configuration
server.address=0.0.0.0
server.port=8090

cxf.path=/rest

#GENERAL, trazado
#logging.level.org.springframework.security=TRACE
logging.level.ca.uhn.fhir.context.FhirContext=DEBUG

kieserver.serverId=human-tasks-service
kieserver.serverName=human-tasks-service
###############################################################################
###                      IMPORTACIÓN DE KIE SERVERS                         ###
###############################################################################
#para que se pueda acceder desde BC alojado e docker al servidor kie de mi app
kieserver[0].location=http://localhost:8090/rest/server
kieserver[0].user=admin
kieserver[0].pwd=admin

kieserver[1].location=http://localhost:8080/kie-server/services/rest/server
kieserver[1].user=wbadmin
kieserver[1].pwd=wbadmin
###############################################################################

#kieserver.controllers=
#propiedades del sistema para la configuracion del servidor
#utilizar el prefijo system.properties y a continuacion nombre de la propiedad y valor
system.properties.org.kie.server.bypass.auth.user=true

#kie server capabilities
kieserver.drools.enabled=true
kieserver.dmn.enabled=true
kieserver.jbpm.enabled=true
kieserver.jbpmui.enabled=true
kieserver.casemgmt.enabled=true
#kieserver.prometheus.enabled=true

kieserver.swagger.enabled=true

#jbpm configuration
jbpm.executor.enabled=false
#jbpm.executor.retries=5
#jbpm.executor.interval=3
#jbpm.executor.threadPoolSize=1
#jbpm.executor.timeUnit=SECONDS

#data source configuration
spring.datasource.username=jbpm
spring.datasource.password=jbpm.2.DDBB*
spring.datasource.url=jdbc:postgresql://localhost:5432/ht
spring.datasource.driver-class-name=org.postgresql.xa.PGXADataSource

#hibernate configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#transaction manager configuration
spring.jta.narayana.transaction-manager-id=1

#banner
spring.banner.location=classpath:banner.txt

#fhir
fhir.server.base=https://hapi.fhir.org/baseR5
#fhir.server.base=http://localhost:8888/fhir

#variables para los tests

#identificador del cuestionario fhir pasado como entrada a las tareas humanas de test
test.questionnaireid=765063

#nombre del contenedor desplegado en el servidor kie embebido
test.containerid=human-tasks-management_1.0.0-SNAPSHOT
#nombre del proceso que contiene una tarea asignada al role wbadmin sin temporizador
test.roleprocessWithoutTimer=HumanTasksManagement.TareaARolSinTimer
#nombre del proceso que asigna una tarea al usuario que lo inicia
test.userprocess=HumanTasksManagement.TareaAUsuario
#nombre del proceso que contiene una tarea asignada al role wbadmin
test.roleprocessHigh=HumanTasksManagement.TareaARolUrgente
test.roleprocessMedium=HumanTasksManagement.TareaARolMedia
test.roleprocessLow=HumanTasksManagement.TareaARolLeve

